 font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="400" >designs new intelligence</text><text x="1425" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#d29922" text-anchor="middle" font-weight="600" >proposed level</text><rect x="60" y="160" width="620" height="170" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="84" y="200" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3" text-anchor="start" font-weight="700" >How security is attached today</text><text x="84" y="232" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >First we build the system, then we surround it with</text><g><rect x="88.0" y="265.0" width="124" height="34" rx="17.0" fill="#58a6ff" fill-opacity="0.22" stroke="#58a6ff" stroke-width="2"/><text x="150" y="289" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >policies</text></g><g><rect x="228.0" y="265.0" width="124" height="34" rx="17.0" fill="#58a6ff" fill-opacity="0.22" stroke="#58a6ff" stroke-width="2"/><text x="290" y="289" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >permissions</text></g><g><rect x="368.0" y="265.0" width="124" height="34" rx="17.0" fill="#bc8cff" fill-opacity="0.22" stroke="#bc8cff" stroke-width="2"/><text x="430" y="289" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >filters</text></g><g><rect x="508.0" y="265.0" width="124" height="34" rx="17.0" fill="#9aa4af" fill-opacity="0.22" stroke="#9aa4af" stroke-width="2"/><text x="570" y="289" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >sandboxes</text></g><rect x="760" y="160" width="440" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="784" y="200" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#d29922" text-anchor="start" font-weight="700" >The question at the next level</text><text x="784" y="230" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >If intelligence becomes the material</text><text x="784" y="256" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >of programming, where does security belong?</text><text x="800" y="862" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="400" >The analogy is not exact: what transfers is the pattern of building new behavior from a lower-level substrate.</text></svg>