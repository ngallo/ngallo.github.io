troke="#f85149" stroke-width="2"/><text x="220" y="657" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >sensor failure</text></g><g><rect x="440.0" y="632.0" width="320" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="600" y="657" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >motor malfunction</text></g><g><rect x="60.0" y="694.0" width="320" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="220" y="719" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >external force</text></g><g><rect x="440.0" y="694.0" width="320" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="600" y="719" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >unmodeled channels</text></g><rect x="1010" y="520" width="540" height="250" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="1040" y="562" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#d29922" text-anchor="start" font-weight="700" >Independent safeguards remain</text><text x="1040" y="600" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >interlocks, mechanical limits,</text><text x="1040" y="626" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >emergency stops, physical barriers</text><text x="1040" y="668" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >Replacing one requires evidence that</text><text x="1040" y="694" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >the complete physical system preserves</text><text x="1040" y="720" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >the property under its fault and threat model.</text><text x="800" y="840" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="middle" font-weight="400" >Logical impossibility is not physical impossibility.</text></svg>