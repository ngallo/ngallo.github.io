<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="h-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#58a6ff"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#3fb950"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#bc8cff"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#d29922"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#f85149"/></marker><marker id="h-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#9aa4af"/></marker><marker id="h-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#e6edf3"/></marker></defs><rect width="1600" height="900" fill="#0d1117"/><text x="800" y="68" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#e6edf3" text-anchor="middle" font-weight="700" >External control vs. logical security</text><text x="800" y="104" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle" font-weight="400" >Rejecting forbidden choices after they are produced, or generating a system in which they are not valid transitions</text><rect x="40" y="140" width="740" height="700" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="820" y="140" width="740" height="700" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="410" y="188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3" text-anchor="middle" font-weight="700" >External control</text><text x="410" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="400" >forbidden actions remain candidates</text><rect x="290" y="244" width="240" height="62" rx="12" fill="#161b22" stroke="#9aa4af" stroke-width="2.5"/><rect x="290" y="244" width="240" height="62" rx="12" fill="#9aa4af" fill-opacity="0.14"/><text x="410.0" y="282.7" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="700" >Intelligence</text><path d="M 410 310 L 130 360" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><g><rect x="55.0" y="366.0" width="150" height="36" rx="18.0" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="2"/><text x="130" y="391" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Forward</text></g><path d="M 130 404 L 130 452" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><path d="M 410 310 L 310 360" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><g><rect x="235.0" y="366.0" width="150" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="310" y="391" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Backward</text></g><path d="M 310 404 L 310 452" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><path d="M 410 310 L 510 360" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><g><rect x="435.0" y="366.0" width="150" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="510" y="391" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Left</text></g><path d="M 510 404 L 510 452" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><path d="M 410 310 L 690 360" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><g><rect x="615.0" y="366.0" width="150" height="36" rx="18.0" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2"/><text x="690" y="391" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Right</text></g><path d="M 690 404 L 690 452" fill="none" stroke="#9aa4af" stroke-width="2" stroke-linecap="round" marker-end="url(#h-grey)"/><rect x="70" y="458" width="680" height="64" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2.5"/><rect x="70" y="458" width="680" height="64" rx="12" fill="#d29922" fill-opacity="0.14"/><text x="410.0" y="497.35" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e6edf3" text-anchor="middle" font-weight="700" >Security policy  (external filter)</text><path d="M 130 526 L 130 590" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" marker-end="url(#h-green)"/><rect x="60" y="596" width="150" height="56" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/><rect x="60" y="596" width="150" height="56" rx="12" fill="#3fb950" fill-opacity="0.14"/><text x="135.0" y="631.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3" text-anchor="middle" font-weight="700" >Forward</text><path d="M 310 526 L 310 566" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="310" cy="584" r="15" fill="#0d1117" stroke="#f85149" stroke-width="3"/><path d="M 303.7 577.7 L 316.3 590.3 M 316.3 577.7 L 303.7 590.3" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/><path d="M 510 526 L 510 566" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="510" cy="584" r="15" fill="#0d1117" stroke="#f85149" stroke-width="3"/><path d="M 503.7 577.7 L 516.3 590.3 M 516.3 577.7 L 503.7 590.3" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/><path d="M 690 526 L 690 566" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="690" cy="584" r="15" fill="#0d1117" stroke="#f85149" stroke-width="3"/><path d="M 683.7 577.7 L 696.3 590.3 M 696.3 577.7 L 683.7 590.3" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/><text x="510" y="630" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f85149" text-anchor="middle" font-weight="600" >rejected after being chosen</text><text x="70" y="724" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >The guarantee depends on the filter seeing every path to the</text><text x="70" y="750" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >same effect: another command, a sequence of commands,</text><text x="70" y="776" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >a delegated agent, or a newly generated tool.</text><text x="1190" y="188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3" text-anchor="middle" font-weight="700" >Logical security</text><text x="1190" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="400" >forbidden actions are absent from the action space</text><rect x="850" y="244" width="300" height="62" rx="12" fill="#161b22" stroke="#9aa4af" stroke-width="2.5"/><rect x="850" y="244" width="300" height="62" rx="12" fill="#9aa4af" fill-opacity="0.14"/><text x="1000.0" y="282.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3" text-anchor="middle" font-weight="700" >Original intelligence</text><rect x="1180" y="244" width="350" height="62" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/><rect x="1180" y="244" width="350" height="62" rx="12" fill="#58a6ff" fill-opacity="0.14"/><text x="1355.0" y="282.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3" text-anchor="middle" font-weight="700" >Inherited security state</text><path d="M 1000 310 Q 1000 340 1110 358" fill="none" stroke="#9aa4af" stroke-width="2.2" stroke-linecap="round" marker-end="url(#h-grey)"/><path d="M 1355 310 Q 1355 340 1270 358" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#h-blue)"/><rect x="1040" y="362" width="300" height="62" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2.5"/><rect x="1040" y="362" width="300" height="62" rx="12" fill="#bc8cff" fill-opacity="0.14"/><text x="1190.0" y="400.35" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e6edf3" text-anchor="middle" font-weight="700" >Meta-intelligence</text><text x="1352" y="392" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="start" font-weight="400" >generation is a</text><text x="1352" y="412" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="start" font-weight="400" >checked causal step</text><path d="M 1190 428 L 1190 470" fill="none" stroke="#bc8cff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h-purple)"/><rect x="900" y="476" width="580" height="186" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/><rect x="900" y="476" width="580" height="186" rx="12" fill="#58a6ff" fill-opacity="0.08"/><text x="1190" y="512" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="700" >Generated intelligence</text><text x="1190" y="538" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="400" >executable action space</text><g><rect x="1025.0" y="564.0" width="150" height="36" rx="18.0" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="2"/><text x="1100" y="589" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Forward</text></g><g><rect x="1205.0" y="564.0" width="150" height="36" rx="18.0" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="2"/><text x="1280" y="589" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600" >Stop</text></g><text x="1190" y="640" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#58a6ff" text-anchor="middle" font-weight="600" >Forward only while the path is clear  (inherited rule)</text><g opacity="0.55"><rect x="935.0" y="688.0" width="150" height="36" rx="18.0" fill="#9aa4af" fill-opacity="0.08" stroke="#9aa4af