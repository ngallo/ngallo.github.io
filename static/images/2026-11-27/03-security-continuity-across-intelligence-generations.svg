" stroke-linejoin="round"/><g><rect x="1200.0" y="515.0" width="120" height="32" rx="16.0" fill="#bc8cff" fill-opacity="0.22" stroke="#bc8cff" stroke-width="2"/></g><rect x="30" y="602" width="750" height="190" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="9 7"/><circle cx="70" cy="642" r="15" fill="#0d1117" stroke="#f85149" stroke-width="3"/><path d="M 63.7 635.7 L 76.3 648.3 M 76.3 635.7 L 63.7 648.3" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/><text x="98" y="650" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#f85149" text-anchor="start" font-weight="700" >Silent expansion: rejected</text><text x="56" y="690" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >A generated system claims more authority than its parent,</text><text x="56" y="716" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >merges two lineages into the union of their permissions,</text><text x="56" y="742" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >or opens a fresh origin outside the authorized gate.</text><text x="56" y="772" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >None of these is a valid continuation.</text><rect x="820" y="602" width="750" height="190" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><circle cx="860" cy="642" r="11" fill="none" stroke="#d29922" stroke-width="2.2"/><path d="M 855 642 L 858.5 646 L 865.5 638" fill="none" stroke="#d29922" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="886" y="650" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#d29922" text-anchor="start" font-weight="700" >Explicit, authorized grant: allowed</text><text x="846" y="690" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >New authority enters only through a distinct, auditable</text><text x="846" y="716" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >event justified by a legitimate principal or policy rule.</text><text x="846" y="742" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="400" >From that point on, a new bound applies.</text><text x="846" y="772" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >It is never a side effect of learning or generation.</text><text x="800" y="852" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="400" >Capability can grow while the security envelope stays bounded by its origin, for every descendant, however deep.</text></svg>