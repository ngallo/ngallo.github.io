<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="h-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#58a6ff"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#3fb950"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#f85149"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#bc8cff"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#d29922"/></marker><marker id="h-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#9aa4af"/></marker><marker id="h-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 10 5 L 0 9.2 z" fill="#e6edf3"/></marker></defs><rect width="1600" height="900" fill="#0d1117"/><text x="800.0" y="68" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#e6edf3" text-anchor="middle" font-weight="700" >The gap between permission and execution</text><rect x="60" y="135" width="720" height="640" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="420" y="185" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="middle" font-weight="600" >Fabricated result after a denied call</text><rect x="320" y="225" width="200" height="84" rx="12" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="2"/><text x="420.0" y="275.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >Tool A</text><rect x="320" y="425" width="200" height="84" rx="12" fill="#9aa4af" fill-opacity="0.13" stroke="#9aa4af" stroke-width="2"/><text x="420.0" y="475.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >AI agent</text><rect x="320" y="635" width="200" height="84" rx="12" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="2"/><text x="420.0" y="685.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >Tool B</text><path d="M 375 425 L 375 317" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#h-blue)"/><text x="355" y="375" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff" text-anchor="end" font-weight="400" >1. call Tool A</text><path d="M 465 309 L 465 417" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#h-red)"/><circle cx="465" cy="364" r="17" fill="#0d1117" stroke="#f85149" stroke-width="3"/><path d="M 457.86 356.86 L 472.14 371.14 M 472.14 356.86 L 457.86 371.14" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/><text x="495" y="358" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#f85149" text-anchor="start" font-weight="400" >2. access denied</text><text x="495" y="384" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >no output exists</text><path d="M 420 509 L 420 627" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round" marker-end="url(#h-red)"/><text x="444" y="562" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#f85149" text-anchor="start" font-weight="400" >3. invented “result of A”</text><text x="444" y="588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >sent as though A had run</text><text x="396" y="574" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="end" font-weight="400" >plausible, unsupported</text><rect x="820" y="135" width="720" height="640" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="1180" y="185" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="middle" font-weight="600" >Tampered result after an authorized call</text><rect x="1080" y="225" width="200" height="84" rx="12" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="2"/><text x="1180.0" y="275.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >Tool A</text><rect x="1080" y="425" width="200" height="84" rx="12" fill="#9aa4af" fill-opacity="0.13" stroke="#9aa4af" stroke-width="2"/><text x="1180.0" y="475.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >AI agent</text><rect x="1080" y="635" width="200" height="84" rx="12" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="2"/><text x="1180.0" y="685.4" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600" >Tool B</text><path d="M 1135 425 L 1135 317" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#h-blue)"/><text x="1115" y="375" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff" text-anchor="end" font-weight="400" >1. call Tool A</text><path d="M 1225 309 L 1225 417" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" marker-end="url(#h-green)"/><text x="1245" y="358" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#3fb950" text-anchor="start" font-weight="400" >2. authentic result</text><text x="1245" y="384" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >really produced by A</text><path d="M 1180 509 L 1180 627" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round" marker-end="url(#h-red)"/><text x="1204" y="562" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#f85149" text-anchor="start" font-weight="400" >3. modified result</text><text x="1204" y="588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="400" >values changed before forwarding</text><text x="1156" y="574" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="end" font-weight="400" >still labelled “from A”</text><text x="800.0" y="835" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="middle" font-weight="600" >A valid permission check does not prove a valid data path.</text><path d="M 520 868 L 570 868" stroke="#58a6ff" stroke-width="3"/><text x="580" y="874" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >trusted call</text><path d="M 710 868 L 760 868" stroke="#3fb950" stroke-width="3"/><text x="770" y="874" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >authentic output</text><path d="M 930 868 L 980 868" stroke="#f85149" stroke-width="3"/><text x="990" y="874" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="400" >invented or modified</text></svg>